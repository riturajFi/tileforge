[project]
name = "tileforge"
version = "0.0.0"
description = "Build FlashAttention forward kernels from scratch, one verified milestone at a time."
requires-python = ">=3.12,<3.13"
dependencies = ["numpy==2.4.2", "torch==2.10.0"]

[tool.uv]
package = false
required-version = ">=0.12.23,<0.13"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
